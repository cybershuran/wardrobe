<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardrobe · 衣橱</title>
<style>
  :root{
    --bg:#fff; --cell:#efefef; --ink:#111; --muted:#8b8b8b; --line:#e5e5e5;
    --panelW:min(560px, 92vw);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  ::selection{background:#111;color:#fff}

  /* ---------- 顶栏 ---------- */
  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:34px;
    padding:0 28px;height:64px;overflow-x:auto;white-space:nowrap}
  .brand{font-weight:700;letter-spacing:.22em;font-size:15px;flex-shrink:0}
  .brand span{font-weight:400;letter-spacing:.1em;color:#555;margin-left:8px;font-size:14px}
  .tab{font-size:13px;letter-spacing:.18em;font-weight:600;color:#666;cursor:pointer;
    padding:6px 0;border-bottom:2px solid transparent;flex-shrink:0}
  .tab small{font-weight:400;letter-spacing:0;color:#aaa;margin-left:5px;font-size:11.5px}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}

  /* ---------- 网格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:#fff;padding:1px 0}
  .cell{background:var(--cell);aspect-ratio:1;position:relative;cursor:pointer;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .cell img{width:82%;height:82%;object-fit:contain;transition:transform .3s;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.13)) drop-shadow(0 1px 3px rgba(0,0,0,.10))}
  .cell:hover img{transform:scale(1.05)}
  .cell .pk{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;
    border:1.5px solid #bbb;background:rgba(255,255,255,.85);color:transparent;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
    opacity:0;transition:.15s}
  .cell:hover .pk{opacity:1}
  .cell.picked .pk{opacity:1;background:#111;border-color:#111;color:#fff}

  /* ---------- OUTFITS ---------- */
  .outfits{padding:34px 28px 100px;max-width:1100px;margin:0 auto}
  .lk{border-bottom:1px solid var(--line);padding:26px 0}
  .lk h3{margin:0 0 4px;font-size:15px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;
    display:flex;justify-content:space-between;align-items:baseline}
  .lk h3 .del{font-size:11px;letter-spacing:.1em;color:#b33;cursor:pointer;font-weight:400}
  .lk .strip{display:flex;gap:1px;margin-top:14px;flex-wrap:wrap}
  .lk .strip .s{width:110px;height:130px;background:var(--cell);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .lk .strip .s img{width:84%;height:84%;object-fit:contain;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.13))}
  .lk .names{font-size:12.5px;color:var(--muted);margin-top:10px;letter-spacing:.02em}
  .emptymsg{color:var(--muted);font-size:13.5px;letter-spacing:.06em;padding:60px 0;text-align:center}

  /* ---------- 详情滑出面板 ---------- */
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.25s;z-index:30}
  #shade.show{opacity:1;pointer-events:auto}
  #panel{position:fixed;top:0;right:0;bottom:0;width:var(--panelW);background:#fff;z-index:40;
    transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);overflow-y:auto}
  #panel.show{transform:none}
  #panel .close{position:sticky;top:0;float:right;margin:16px 18px 0 0;font-size:20px;cursor:pointer;
    background:#fff;border:none;padding:6px 10px;line-height:1;z-index:2}
  #panel .photo{background:#f4f4f4;min-height:52vh;display:flex;align-items:center;justify-content:center;padding:30px}
  #panel .photo img{max-width:100%;max-height:60vh;object-fit:contain;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.14))}
  #panel .info{padding:26px 34px 60px}
  .kicker{font-size:12.5px;color:#666;letter-spacing:.06em;margin-bottom:14px}
  .titleRow{display:flex;gap:14px;align-items:center;margin-bottom:4px}
  .titleRow .mini{width:56px;height:56px;background:var(--cell);flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .titleRow .mini img{width:80%;height:80%;object-fit:contain;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.12))}
  .titleRow h2{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:.02em;font-weight:700;text-transform:uppercase;line-height:1.1}
  .subcn{font-size:14px;color:#555;margin:6px 0 22px}
  .sec{border-top:1px solid var(--line);padding:18px 0}
  .sec .lab{font-size:11.5px;letter-spacing:.22em;font-weight:700;color:#444;text-transform:uppercase;margin-bottom:12px}
  .swatches{display:flex;gap:10px}
  .sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
  .notes{font-size:13.5px;color:#333;line-height:1.7}
  .pbtns{display:flex;gap:10px;margin-top:26px}
  .pbtns button{flex:1;padding:13px;font-size:12.5px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;
    cursor:pointer;border:1px solid #111;background:#111;color:#fff;font-family:inherit}
  .pbtns button.alt{background:#fff;color:#111}

  /* ---------- 底部选择条 ---------- */
  #bar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);transition:.25s;z-index:25;
    background:#111;color:#fff;border-radius:999px;padding:12px 10px 12px 22px;display:flex;align-items:center;gap:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
  #bar.show{transform:translate(-50%,0)}
  #bar .t{font-size:12.5px;letter-spacing:.14em;font-weight:600}
  #bar button{border:none;border-radius:999px;padding:9px 16px;font-size:12px;letter-spacing:.12em;font-weight:700;
    cursor:pointer;background:#fff;color:#111;font-family:inherit}
  #bar button.link{background:transparent;color:#999}

  /* ---------- AI 区 ---------- */
  .ai{border-top:1px solid var(--line);margin-top:40px;padding-top:26px}
  .ai summary{font-size:12px;letter-spacing:.2em;font-weight:700;color:#666;cursor:pointer;text-transform:uppercase}
  .ai .frm{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .ai input{flex:1;min-width:160px;padding:11px 13px;border:1px solid var(--line);font-size:13px;font-family:inherit;background:#fafafa}
  .ai button{padding:11px 20px;font-size:12px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;
    border:1px solid #111;background:#111;color:#fff;cursor:pointer;font-family:inherit}
  .ai .msg{font-size:13px;margin-top:12px;color:#666;display:none}
  .ai .msg.show{display:block}
  .ai .msg.err{color:#b33}
</style>
</head>
<body>

<nav id="nav"></nav>
<div id="view"></div>

<div id="bar">
  <span class="t">已选 <span id="barN">0</span> 件</span>
  <button onclick="saveLook()">保存 OUTFIT</button>
  <button class="link" onclick="clearPicks()">清空</button>
</div>

<div id="shade" onclick="closePanel()"></div>
<aside id="panel">
  <button class="close" onclick="closePanel()">✕</button>
  <div id="panelBody"></div>
</aside>

<script src="items.js"></script>
<script>

/* ================= 状态 ================= */
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('wv_'+k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('wv_'+k, JSON.stringify(v)) }catch(e){} }
};
let looks = store.get('looks', []);
let picked = new Set();
let tab = 'ALL';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ================= 导航 ================= */
function countOf(k){
  if(k==='ALL') return ITEMS.length;
  if(k==='OUTFITS') return looks.length;
  return ITEMS.filter(i=>i.cat===k).length;
}
function renderNav(){
  $('nav').innerHTML = `<div class="brand">WARDROBE<span>衣橱</span></div>` +
    CATS.map(c=>`<div class="tab ${tab===c.key?'on':''}" onclick="setTab('${c.key}')">${c.key}<small>${countOf(c.key)}</small></div>`).join('');
}
function setTab(k){ tab=k; renderNav(); renderView(); }

/* ================= 视图 ================= */
function renderView(){
  if(tab==='OUTFITS') return renderOutfits();
  const list = tab==='ALL'? ITEMS : ITEMS.filter(i=>i.cat===tab);
  $('view').innerHTML = `<div class="grid">` + list.map(it=>`
    <div class="cell ${picked.has(it.id)?'picked':''}" id="c_${it.id}" onclick="openPanel('${it.id}')">
      <img src="${it.img}" loading="lazy" alt="${esc(it.cn)}">
      <div class="pk" onclick="event.stopPropagation();togglePick('${it.id}')">✓</div>
    </div>`).join('') + `</div>`;
}

/* ================= 详情面板 ================= */
function openPanel(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  $('panelBody').innerHTML = `
    <div class="photo"><img src="${it.img}"></div>
    <div class="info">
      <div class="titleRow">
        <div class="mini"><img src="${it.img}"></div>
        <h2>${esc(it.en)}</h2>
      </div>
      <div class="subcn">${esc(it.cn)}</div>
      <div class="sec"><div class="lab">${esc(it.cat)}</div></div>
      <div class="sec">
        <div class="lab">Colour Palette</div>
        <div class="swatches">${it.pal.map(c=>`<div class="sw" style="background:${c}" title="${c}"></div>`).join('')}</div>
      </div>
      <div class="sec">
        <div class="lab">Notes</div>
        <div class="notes">${esc(it.notes)} · 适合季节：${esc(it.season)}</div>
      </div>
      <div class="pbtns">
        <button onclick="togglePick('${it.id}');openPanel('${it.id}')">${picked.has(it.id)?'✓ 已选入搭配':'选入搭配'}</button>
        <button class="alt" onclick="closePanel()">返回</button>
      </div>
    </div>`;
  $('shade').classList.add('show'); $('panel').classList.add('show');
}
function closePanel(){ $('shade').classList.remove('show'); $('panel').classList.remove('show'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

/* ================= 搭配 ================= */
function togglePick(id){
  picked.has(id)? picked.delete(id) : picked.add(id);
  if(tab!=='OUTFITS') renderView();
  $('barN').textContent = picked.size;
  $('bar').classList.toggle('show', picked.size>0);
}
function clearPicks(){ picked.clear(); if(tab!=='OUTFITS') renderView(); $('bar').classList.remove('show'); }
function saveLook(){
  if(picked.size<2) return alert('至少选 2 件再保存哦。');
  const name = prompt('给这套 OUTFIT 起个名字：','未命名搭配');
  if(name===null) return;
  looks.unshift({id:'L'+Date.now(), name:name||'未命名搭配', items:[...picked], note:''});
  store.set('looks',looks); clearPicks(); renderNav(); setTab('OUTFITS');
}
function delLook(id){ looks=looks.filter(l=>l.id!==id); store.set('looks',looks); renderNav(); renderOutfits(); }

function renderOutfits(){
  const body = looks.length ? looks.map(l=>`
    <div class="lk">
      <h3>${esc(l.name)}<span class="del" onclick="delLook('${l.id}')">删除</span></h3>
      <div class="strip">${l.items.map(id=>{
        const it=ITEMS.find(x=>x.id===id);
        return it?`<div class="s" onclick="openPanel('${it.id}')"><img src="${it.img}" title="${esc(it.cn)}"></div>`:'';
      }).join('')}</div>
      <div class="names">${l.items.map(id=>ITEMS.find(x=>x.id===id)?.cn).filter(Boolean).join(' + ')}</div>
      ${l.note?`<div class="names">💡 ${esc(l.note)}</div>`:''}
    </div>`).join('')
    : `<div class="emptymsg">还没有 OUTFIT — 回到衣橱，把鼠标移到单品上点右上角 ✓ 选几件，然后保存。</div>`;

  $('view').innerHTML = `<div class="outfits">${body}
    <details class="ai">
      <summary>✨ AI Styling（可选 · 填一次 Kimi Key 即可）</summary>
      <div class="frm">
        <input type="password" id="apiKey" placeholder="API Key（用本机代理时免填）" value="${esc(store.get('apiKey','')||'')}">
        <input type="text" id="baseUrl" placeholder="API 地址" value="${esc(store.get('baseUrl','http://127.0.0.1:8643'))}">
        <input type="text" id="aiModel" placeholder="模型" value="${esc(store.get('aiModel','kimi-for-coding'))}">
      </div>
      <div class="frm">
        <input type="text" id="occasion" placeholder="场合：约会 / 面试 / 周末咖啡厅…">
        <button onclick="aiSuggest()">AI 搭配</button>
      </div>
      <div class="msg" id="aiMsg"></div>
      <div id="aiOut"></div>
    </details>
  </div>`;
}

/* ================= AI（可选） ================= */
async function aiSuggest(){
  const k=$('apiKey').value.trim();
  const msg=$('aiMsg');
  store.set('apiKey',k); store.set('baseUrl',$('baseUrl').value.trim()); store.set('aiModel',$('aiModel').value.trim());
  const localProxy = /^https?:\/\/(127\.0\.0\.1|localhost):/.test($('baseUrl').value.trim());
  if(!k && !localProxy){ msg.className='msg show err'; msg.textContent='需要 API Key；或本机跑 scripts/proxy.py 并把地址填为 http://127.0.0.1:8643（Key 由代理注入）。'; return; }
  msg.className='msg show'; msg.textContent='AI 正在挑搭配…';
  try{
    const list = ITEMS.map(it=>`${it.id}: ${it.cn}（${it.cat}/${it.season}，${it.notes}）`).join('\n');
    const occ = $('occasion').value.trim();
    const base = ($('baseUrl').value.trim()||'http://127.0.0.1:8643').replace(/\/$/,'');
    const res = await fetch(base+'/chat/completions',{
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
      body:JSON.stringify({model:$('aiModel').value.trim()||'kimi-for-coding',
        messages:[{role:'user',content:`衣橱单品清单：\n${list}\n\n${occ?'场合：'+occ+'\n':''}只用清单里的单品（用 id 引用），搭配 3 套。只返回 JSON：{"outfits":[{"title":"","ids":[],"reason":""}]}`}],
        response_format:{type:'json_object'}})
    });
    if(!res.ok) throw new Error('接口报错 '+res.status);
    const data = await res.json();
    const parsed = JSON.parse(data.choices[0].message.content);
    $('aiOut').innerHTML = (parsed.outfits||[]).map(o=>`
      <div class="lk">
        <h3>${esc(o.title)}<span class="del" onclick='adoptLook(${JSON.stringify(o.ids||[])},${JSON.stringify(String(o.title||"AI 搭配"))},${JSON.stringify(String(o.reason||""))})' style="color:#111">存为 OUTFIT</span></h3>
        <div class="strip">${(o.ids||[]).map(id=>{const it=ITEMS.find(x=>x.id===id);
          return it?`<div class="s"><img src="${it.img}"></div>`:''}).join('')}</div>
        <div class="names">💡 ${esc(o.reason||'')}</div>
      </div>`).join('');
    msg.className='msg';
  }catch(e){ msg.className='msg show err'; msg.textContent=e.message; }
}
function adoptLook(ids,name,note){
  looks.unshift({id:'L'+Date.now(), name, items:ids.filter(id=>ITEMS.find(x=>x.id===id)), note});
  store.set('looks',looks); renderNav(); renderOutfits();
}

/* ================= 启动 ================= */
renderNav(); renderView();
</script>
</body>
</html>
